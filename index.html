        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        // لوحة ألوان مميزة وواضحة لكل كلمة في نموذج الإجابة والطباعة
        const WORD_COLOR_PALETTE = [

            { bg: '#dbeafe', border: '#3b82f6', text: '#1e40af' }, // أزرق
            { bg: '#dcfce7', border: '#22c55e', text: '#166534' }, // أخضر
            { bg: '#fef3c7', border: '#f59e0b', text: '#92400e' }, // كهرماني

            { bg: '#cffafe', border: '#06b6d4', text: '#155e75' }, // سماوي
            { bg: '#ffedd5', border: '#f97316', text: '#9a3412' }, // برتقالي
            { bg: '#e0e7ff', border: '#6366f1', text: '#3730a3' }, // نيلي
            { bg: '#ecfccb', border: '#84cc16', text: '#3f6212' }, // ليموني
            { bg: '#ccfbf1', border: '#14b8a6', text: '#115e59' }, // فيروزي
            { bg: '#fae8ff', border: '#d946ef', text: '#86198f' }, // فوشيا
            { bg: '#ffe4e6', border: '#f43f5e', text: '#9f1239' }, // قرمزي

            { bg: '#fef9c3', border: '#eab308', text: '#854d0e' }, // أصفر

            { bg: '#ede9fe', border: '#8b5cf6', text: '#5b21b6' }, // أرجواني
            { bg: '#f1f5f9', border: '#64748b', text: '#1e293b' }, // رمادي مزرق
            { bg: '#fde68a', border: '#d97706', text: '#78350f' }, // ذهبي
            { bg: '#fbcfe8', border: '#db2777', text: '#831843' }, // زهري غامق
        ];

        const getWordColor = (index) => {
            if (index < 0) return null;
            if (index < WORD_COLOR_PALETTE.length) return WORD_COLOR_PALETTE[index];
            const hue = (index * 137.508) % 360;
            return {
                bg: `hsl(${hue}, 85%, 90%)`,
                border: `hsl(${hue}, 75%, 45%)`,
                text: `hsl(${hue}, 85%, 25%)`
            };
        };

        const CACHE_KEYS = {
            QUESTIONS: `${appId}_cached_questions`,
            SCHOOLS: `${appId}_cached_schools`,
            CONFIG: `${appId}_cached_config`
        };

        const loadCache = (key, fallback) => {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : fallback;
            } catch (e) {
                return fallback;
            }
        };

        const saveCache = (key, data) => {
            try {
                localStorage.setItem(key, JSON.stringify(data));
            } catch (e) {}
        };

        const TRAINING_QUESTIONS = [
            { id: 't1', question: "عاصمة سلطنة عمان", answer: "مسقط" },
            { id: 't2', question: "العملة الرسمية في عمان", answer: "الريال" },
            { id: 't3', question: "يحد عمان من جهة الغرب", answer: "السعودية" },
            { id: 't4', question: "تقع عمان في قارة", answer: "اسيا" },
            { id: 't5', question: "نظام الحكم في عمان", answer: "سلطاني" }
        ];

        const getCollection = (name) => db.collection(`artifacts/${appId}/public/data/${name}`);
        
        const formatTime = (ms) => {
            if (ms === null || ms < 0) return "00:00";
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        };

        // تنظيف الإجابة من المسافات والرموز والتطويل لضمان التطابق الدقيق
        const cleanWord = (str) => (str || '').replace(/[\s\u0640]/g, '').trim();

        // حساب أصغر حجم شبكة ممكن لتقليل الحروف العشوائية غير المهمة لتناسب طلبة الصف الخامس
        const calculateGridSize = (questionList) => {
            if (!questionList || questionList.length === 0) return 10;
            const totalChars = questionList.reduce((acc, q) => acc + cleanWord(q.answer).length, 0);
            const longestWord = Math.max(...questionList.map(q => cleanWord(q.answer).length), 0);
            // استخدام معامل ضغط أصغر لتقليص حجم الشبكة والمسافات الفارغة قدر الإمكان
            const suggestedSize = Math.ceil(Math.sqrt(totalChars * 1.9)); 
            let size = Math.max(9, longestWord, suggestedSize);
            return Math.min(22, size); 
        };

        // جميع الاتجاهات الـ 8 المسموحة في خط مستقيم (أفقي، عمودي، قطري، وعكسها)
        const DIRECTIONS = [
            { dx: 1, dy: 0 },   // أفقي
            { dx: 0, dy: 1 },   // عمودي للأسفل
            { dx: 1, dy: 1 },   // قطري رئيسي
            { dx: 1, dy: -1 },  // قطري عكسي
            { dx: -1, dy: 0 },  // أفقي معكوس
            { dx: 0, dy: -1 },  // عمودي للأعلى
            { dx: -1, dy: -1 }, // قطري رئيسي معكوس
            { dx: -1, dy: 1 }   // قطري عكسي معكوس
        ];

        const createGridLogic = (questionList, size) => {
            const activeQuestions = questionList && questionList.length > 0 ? questionList : TRAINING_QUESTIONS;
            let newGrid = Array.from({ length: size * size }, (_, idx) => ({
                char: '',
                id: `empty-${idx}`,
                wordId: null,
                wordIds: []
            }));
            const getIndex = (x, y) => y * size + x;

            // ترتيب الكلمات من الأطول إلى الأقصر مع خلط عشوائي للكلمات المتساوية في الطول
            const sortedQuestions = [...activeQuestions]
                .map(q => ({ ...q, clean: cleanWord(q.answer), rand: Math.random() }))
                .sort((a, b) => (b.clean.length - a.clean.length) || (a.rand - b.rand));

            const missing = [];
            let placedCount = 0;

            sortedQuestions.forEach((q) => {
                const word = q.clean;
                if (!word) return;
                if (word.length > size) {
                    missing.push(q.answer);
                    return;
                }

                let bestCandidate = null;
                let bestScore = -1;

                const shuffledDirs = [...DIRECTIONS].sort(() => 0.5 - Math.random());

                for (let d = 0; d < shuffledDirs.length; d++) {
                    const { dx, dy } = shuffledDirs[d];
                    const isPrimaryDir = (dx >= 0 && dy >= 0);

                    for (let startY = 0; startY < size; startY++) {
                        for (let startX = 0; startX < size; startX++) {
                            const endX = startX + dx * (word.length - 1);
                            const endY = startY + dy * (word.length - 1);
                            if (endX < 0 || endX >= size || endY < 0 || endY >= size) continue;

                            let fits = true;
                            const indices = [];

                            for (let i = 0; i < word.length; i++) {
                                const x = startX + dx * i;
                                const y = startY + dy * i;
                                const idx = getIndex(x, y);
                                const cellChar = newGrid[idx].char;

                                // منع التقاطع نهائياً: يجب أن تكون الخلية فارغة تماماً غير مشغولة بأي كلمة أخرى
                                if (cellChar !== '') {
                                    fits = false;
                                    break;
                                }
                                indices.push(idx);
                            }

                            if (fits) {
                                const score = (isPrimaryDir ? 2 : 0) + Math.random() * 6;
                                if (score > bestScore) {
                                    bestScore = score;
                                    bestCandidate = indices;
                                }
                            }
                        }
                    }
                }

                if (bestCandidate) {
                    bestCandidate.forEach((idx, i) => {
                        newGrid[idx] = {
                            char: word[i],
                            id: `cell-${idx}`,
                            wordId: q.id,
                            wordIds: [q.id]
                        };
                    });
                    placedCount++;
                } else {
                    missing.push(q.answer);
                }
            });

            const finalGrid = newGrid.map((cell, idx) => {
                if (cell.char === '') {
                    return {
                        char: ARABIC_CHARS[Math.floor(Math.random() * ARABIC_CHARS.length)],
                        id: `rand-${idx}`,
                        isRandom: true,
                        wordId: null,
                        wordIds: []
                    };
                }
                return cell;
            });

            return { grid: finalGrid, missing, placedCount, size };
        };

        // توليد الشبكة بدون أي تقاطع بين الكلمات مع توسيع تلقائي للشبكة عند الحاجة
        const generateBestGrid = (questionList, initialSize, triesPerSize = 6) => {
            const activeQuestions = questionList && questionList.length > 0 ? questionList : TRAINING_QUESTIONS;
            const maxWordLen = Math.max(...activeQuestions.map(q => cleanWord(q.answer).length), 0);
            let currentSize = Math.max(initialSize || calculateGridSize(activeQuestions), maxWordLen);
            const maxAllowedSize = Math.max(26, maxWordLen + 2);

            let best = null;

            while (currentSize <= maxAllowedSize) {
                for (let i = 0; i < triesPerSize; i++) {
                    const attempt = createGridLogic(activeQuestions, currentSize);
                    if (!best || attempt.missing.length < best.missing.length) {
                        best = attempt;
                    }
                    if (best.missing.length === 0) {
                        return best;
                    }
                }
                currentSize++;
            }
            return best;
        };

        // دالة طباعة نموذج الإجابة الملون مع الأسئلة ومفاتيح الألوان

                    </div>
                </div>`;
            }).join('');

            const printWin = window.open('', '_blank');
            if (!printWin) {

                        <div class="a-text" style="color:${c.text};">الإجابة: <b>${q.answer}</b></div>
                    </div>

            }).join('');

            const initialSize = calculateGridSize(questionsList);
            const targetSchools = schoolsList && schoolsList.length > 0
                ? schoolsList
                : [{ id: 'sample', name: 'نموذج تجريبي', grid: fallbackGrid, gridSize: fallbackSize }];

            const pagesHtml = targetSchools.map((s, sIdx) => {
                // إذا لم تكن للمدرسة شبكة محفوظة بعد، نولّد لها شبكة مستقلة خاصة بها للطباعة
                let gData = (s.grid && s.grid.length > 0) ? s.grid : null;
                let gSize = s.gridSize || initialSize;
                if (!gData) {
                    const generated = generateBestGrid(questionsList, initialSize);
                    gData = generated.grid;
                    gSize = generated.size || initialSize;
                }
                if (!gData || gData.length === 0) return '';

                const cellsHtml = gData.map((cell) => {
                    const wId = cell.wordId || (Array.isArray(cell.wordIds) && cell.wordIds[0]) || null;
                    const colorInfo = wId ? qColorMap[wId] : null;

                    }
                    return `<div class="cell random" style="font-size:${Math.max(10, Math.floor(360 / gSize))}px;"><span class="char">${cell.char}</span></div>`;

                return `<div class="page-sheet">

            const printWin = window.open('', '_blank');

            printWin.document.write(`<!DOCTYPE html>

        .btn-print { background: #ea580c; color: #fff; border: none; padding: 10px 24px; border-radius: 10px; font-family: 'Tajawal', sans-serif; font-weight: 900; font-size: 15px; cursor: pointer; margin: 0 6px; }
        .btn-close { background: #e5e7eb; color: #374151; border: none; padding: 10px 20px; border-radius: 10px; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; margin: 0 6px; }
        .content-layout { display: flex; flex-direction: column; gap: 14px; align-items: center; }

<body>
    <div class="no-print-bar">
        <button class="btn-print" onclick="window.print()">🖨️ طباعة جميع النماذج (${targetSchools.length})</button>

            printWin.document.close();
        };

        // ترتيب المدارس: الأعلى نقاطاً أولاً، وعند تساوي النقاط تُقدَّم المدرسة التي أنهت المسابقة
        // بوقت أقل (بدقة الميلي ثانية). من لم ينهِ المسابقة يوضع بعد من أنهاها عند تساوي النقاط.
        const sortSchools = (list) => [...list].sort((a, b) => {
            if ((b.score || 0) !== (a.score || 0)) return (b.score || 0) - (a.score || 0);
            // عند تساوي النقاط: الأسبق في اكتساب آخر نقطة يتقدّم (سواء أنهت المسابقة أم لا)
            const at = typeof a.lastSolveMs === 'number' ? a.lastSolveMs : (typeof a.finishTimeMs === 'number' ? a.finishTimeMs : Infinity);
            const bt = typeof b.lastSolveMs === 'number' ? b.lastSolveMs : (typeof b.finishTimeMs === 'number' ? b.finishTimeMs : Infinity);
            if (at !== bt) return at < bt ? -1 : 1;
            return (b.solvedCount || 0) - (a.solvedCount || 0);
        });

        // --- الشاشات ---

        function LoadingScreen() {
            return (
                <div className="flex flex-col items-center justify-center h-[100dvh] bg-orange-50 animate-fadeIn w-full">

        function SelectSchoolScreen({ schools, questions, isDataLoaded, gameConfig, handleStartPlaying, setGameState }) {
            const [enteredCode, setEnteredCode] = useState('');

            const handleLogin = (e) => {

                if (!schools || schools.length === 0) { alert("جاري مزامنة بيانات المدارس، يرجى المحاولة بعد لحظة..."); return; }
                if (!questions || questions.length === 0) { alert("جاري استكمال تحميل بنك الأسئلة، يرجى الانتظار ثانية واحدة..."); return; }
                const foundSchool = schools.find(s => String(s.password).trim() === enteredCode.trim());
                if (foundSchool) handleStartPlaying(foundSchool.id, false);
                else setError(true);

            return (
                <div className="flex flex-col items-center justify-center h-[100dvh] w-full p-4 animate-fadeIn">

                                </span>

        function ResultScreen({ schools, currentSchoolId, score, setGameState, isPracticeMode }) {

            return (

                                    <i className="far fa-clock ml-2"></i>
                                    توقيت الإنجاز: {currentSchool.finishTime}

                            </div>

                        <div className="text-7xl lg:text-8xl font-black text-orange-600 mb-10 tabular-nums">{score} <span className="text-xl lg:text-2xl text-gray-400 font-medium">نقطة</span></div>
                        <button onClick={() => setGameState('welcome')} className="bg-gray-800 text-white px-10 py-4 lg:py-5 rounded-2xl font-bold hover:bg-gray-900 transition w-full flex justify-center items-center gap-3 text-lg lg:text-xl shadow-xl active:scale-95"><i className="fas fa-home"></i> العودة للرئيسية</button>
                    </div>
                </div>

        }

        // شاشة المتابعة للضيوف: عرض فقط (بدون أي تحكم) والترتيب يتحدث لحظياً
        function SpectatorScreen({ schools, questions, gameConfig, timeLeft, setGameState }) {
            const [tab, setTab] = useState('all');
            const total = questions.length;
            const list = tab === 'all' ? schools : schools.filter(s => (tab === 'girls') === (s.type === 'girls'));
            const sorted = sortSchools(list);
            const finishedCount = schools.filter(s => s.completed).length;
            const running = !gameConfig.isLocked && gameConfig.startTime;
            const medal = (i) => i === 0 ? 'bg-yellow-400 text-white' : i === 1 ? 'bg-gray-400 text-white' : i === 2 ? 'bg-orange-400 text-white' : 'bg-orange-100 text-orange-700';
            const tabs = [['all', 'الكل'], ['boys', 'الذكور'], ['girls', 'الإناث']];

            return (
                <div className="h-[100dvh] w-full flex flex-col bg-orange-50 animate-fadeIn">

                        <div className={`px-3 lg:px-4 py-1 rounded-lg font-mono tabular-nums text-lg lg:text-xl text-white shrink-0 ${running ? 'bg-gray-800' : 'bg-gray-400'}`}>{running ? formatTime(timeLeft) : '--:--'}</div>

                        <div className="flex items-center gap-2 text-sm font-bold">

                                <span className={`w-2 h-2 rounded-full ${running ? 'bg-green-500 animate-pulse' : 'bg-gray-400'}`}></span>{running ? 'المسابقة جارية' : 'المسابقة غير جارية'}
                            </span>
                            <span className="bg-white border border-orange-100 text-gray-600 px-3 py-1 rounded-full">أنهت: {finishedCount}/{schools.length}</span>

                    <div className="flex-1 overflow-y-auto p-4 lg:p-6 custom-scrollbar">

                                const girl = s.type === 'girls';
                                const done = s.completed;
                                const solved = s.solvedCount || 0;
                                const pct = total > 0 ? Math.min(100, Math.round(solved / total * 100)) : 0;
                                return (
                                    <div key={s.id} className={`bg-white rounded-2xl shadow-sm border-2 p-3 lg:p-4 transition-all ${done ? 'border-green-200' : 'border-orange-50'}`}>

                                            <span className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center font-black text-lg tabular-nums ${medal(i)}`}>{i + 1}</span>
                                            <div className="flex-1 min-w-0">
                                                <div className="font-bold text-base lg:text-lg truncate">{s.name}
                                                    <span className={`text-[10px] px-2 py-0.5 rounded-full mr-2 align-middle ${girl ? 'bg-pink-100 text-pink-700' : 'bg-blue-100 text-blue-700'}`}>{girl ? 'إناث' : 'ذكور'}</span>
                                                </div>
                                                <div className="mt-1.5 h-2 bg-gray-100 rounded-full overflow-hidden"><div className={`h-full rounded-full transition-all duration-700 ${done ? 'bg-green-500' : 'bg-orange-400'}`} style={{ width: pct + '%' }}></div></div>
                                                <div className="text-xs text-gray-400 font-bold mt-1 tabular-nums">حلّت {solved}{total > 0 ? ` من ${total}` : ''} سؤال</div>
                                            </div>
                                            <div className="text-left shrink-0">
                                                <div className="text-2xl lg:text-3xl font-black text-orange-600 tabular-nums leading-none">{s.score || 0}</div>
                                                {done && s.finishTime
                                                    ? <div className="text-xs text-green-600 font-bold mt-1 tabular-nums"><i className="far fa-clock ml-1"></i>أنهت في {s.finishTime}</div>
                                                    : s.lastSolveTime
                                                        ? <div className="text-xs text-orange-600 font-bold mt-1 tabular-nums"><i className="far fa-clock ml-1"></i>آخر نقطة: {s.lastSolveTime}</div>

                                                {!done && s.lastSolveTime && <div className="text-[10px] text-gray-400 font-bold tabular-nums">جارٍ الحل...</div>}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function AdminScreen({ questions, schools, gameConfig, timeLeft, adminTab, setAdminTab, setGameState, actions, importState, newSchoolState }) {
            const [previewGrid, setPreviewGrid] = useState(null);
            const [missingWords, setMissingWords] = useState([]);
            const [previewGridSize, setPreviewGridSize] = useState(12);
            const [selectedSchoolForKey, setSelectedSchoolForKey] = useState('all');
            const [highlightedQuestionId, setHighlightedQuestionId] = useState(null);
            const [isGeneratingAll, setIsGeneratingAll] = useState(false);

            const activeQuestionsList = questions.length > 0 ? questions : TRAINING_QUESTIONS;

            // ربط كل سؤال بلون ورقم ثابت لعرضه في نموذج الإجابة
            const questionColorMap = useMemo(() => {
                const map = {};
                activeQuestionsList.forEach((q, idx) => {
                    map[q.id] = { ...getWordColor(idx), num: idx + 1, question: q.question, answer: q.answer };
                });
                return map;
            }, [activeQuestionsList]);

            // توليد شبكات مستقلة ومختلفة لكل مدرسة مسجلة لم تحصل على شبكة بعد عند فتح التبويب
            useEffect(() => {
                if (adminTab === 'preview') {
                    const schoolsWithoutGrid = schools.filter(s => !s.grid || s.grid.length === 0);
                    if (schoolsWithoutGrid.length > 0 && activeQuestionsList.length > 0) {
                        handleGenerateUniqueGridsForAllSchools(false);
                    } else if (!previewGrid) {
                        const initialSize = calculateGridSize(activeQuestionsList);
                        const result = generateBestGrid(activeQuestionsList, initialSize);
                        setPreviewGridSize(result.size || initialSize);
                        setPreviewGrid(result.grid);
                        setMissingWords(result.missing);
                    }
                }
            }, [adminTab]);

            // توليد شبكة خاصة ومختلفة تماماً لكل مدرسة وحفظها لكل مدرسة على حدة
            const handleGenerateUniqueGridsForAllSchools = async (confirmRegenerate = true) => {
                if (schools.length === 0) {
                    const initialSize = calculateGridSize(activeQuestionsList);
                    const result = generateBestGrid(activeQuestionsList, initialSize);
                    setPreviewGridSize(result.size || initialSize);
                    setPreviewGrid(result.grid);
                    setMissingWords(result.missing);
                    return;
                }
                if (confirmRegenerate && !window.confirm(`سيتم توليد شبكة خاصة ومختلفة لكل مدرسة من المدارس الـ (${schools.length}) مع حفظ نموذج الإجابة الخاص بكل مدرسة. هل تود المتابعة؟`)) {
                    return;
                }
                try {
                    setIsGeneratingAll(true);
                    const initialSize = calculateGridSize(activeQuestionsList);
                    const batch = db.batch();
                    let lastResult = null;
                    let targetSchoolResult = null;

                    schools.forEach((s) => {
                        const res = generateBestGrid(activeQuestionsList, initialSize);
                        const finalSize = res.size || initialSize;
                        const serializedGrid = res.grid.map(c => ({
                            char: c.char,
                            wordId: c.wordId || null,
                            wordIds: c.wordId ? [c.wordId] : null
                        }));
                        batch.update(getCollection('schools').doc(s.id), {
                            grid: serializedGrid,
                            gridSize: finalSize
                        });
                        lastResult = res;
                        if (s.id === selectedSchoolForKey) {
                            targetSchoolResult = res;
                        }
                    });

                    await batch.commit();
                    const chosen = targetSchoolResult || lastResult;
                    if (chosen) {
                        setPreviewGridSize(chosen.size || initialSize);
                        setPreviewGrid(chosen.grid);
                        setMissingWords(chosen.missing || []);
                    }
                } catch (e) {
                    alert("حدث خطأ أثناء توليد شبكات المدارس: " + e.message);
                } finally {
                    setIsGeneratingAll(false);
                }
            };

            // إعادة توليد شبكة خاصة لمدرسة واحدة فقط
            const handleRegenerateSingleSchoolGrid = async (schoolId) => {
                const schoolObj = schools.find(s => s.id === schoolId);
                if (!schoolObj) return;
                try {
                    setIsGeneratingAll(true);
                    const initialSize = calculateGridSize(activeQuestionsList);
                    const res = generateBestGrid(activeQuestionsList, initialSize);
                    const finalSize = res.size || initialSize;
                    const serializedGrid = res.grid.map(c => ({
                        char: c.char,
                        wordId: c.wordId || null,
                        wordIds: c.wordId ? [c.wordId] : null
                    }));
                    await getCollection('schools').doc(schoolId).update({
                        grid: serializedGrid,
                        gridSize: finalSize
                    });
                    setPreviewGridSize(finalSize);
                    setPreviewGrid(res.grid);
                    setMissingWords(res.missing || []);
                } catch (e) {
                    alert(e.message);
                } finally {
                    setIsGeneratingAll(false);
                }
            };

            const handleSelectSchoolGrid = (val) => {
                setSelectedSchoolForKey(val);
                if (val === 'all') return;
                const found = schools.find(s => s.id === val);
                if (found && found.grid && found.grid.length > 0) {
                    const restored = found.grid.map((c, idx) => {
                        const wId = c.wordId || (Array.isArray(c.wordIds) && c.wordIds[0]) || null;
                        return {
                            char: c.char,
                            id: wId ? `cell-${idx}` : `rand-${idx}`,
                            wordId: wId,
                            wordIds: wId ? [wId] : [],
                            isRandom: !wId
                        };
                    });
                    setPreviewGridSize(found.gridSize || calculateGridSize(activeQuestionsList));
                    setPreviewGrid(restored);
                    setMissingWords([]);
                } else if (found) {
                    handleRegenerateSingleSchoolGrid(found.id);
                }
            };

            const handleDeleteMissingQuestions = async () => {
                if (!window.confirm(`هل تريد حذف ${missingWords.length} أسئلة لم تجد مكاناً في الشبكة؟`)) return;
                const questionsToDelete = questions.filter(q => missingWords.includes(q.answer));
                const batch = db.batch();
                questionsToDelete.forEach(q => batch.delete(getCollection('questions').doc(q.id)));
                try { await batch.commit(); alert("تم تنظيف البنك."); setMissingWords([]); setPreviewGrid(null); } catch (e) { alert(e.message); }
            };

            const boys = sorted.filter(s => s.type !== 'girls');
            const girls = sorted.filter(s => s.type === 'girls');

                            <button onClick={() => setAdminTab('questions')} className={`px-4 py-2 rounded-lg font-bold transition whitespace-nowrap ${adminTab==='questions'?'bg-orange-600 text-white shadow-md':'bg-gray-100 hover:bg-gray-200'}`}>الأسئلة</button>
                            <button onClick={() => setAdminTab('schools')} className={`px-4 py-2 rounded-lg font-bold transition whitespace-nowrap ${adminTab==='schools'?'bg-orange-600 text-white shadow-md':'bg-gray-100 hover:bg-gray-200'}`}>المدارس</button>
                            <button onClick={() => setGameState('welcome')} className="px-4 py-2 bg-red-100 text-red-700 rounded-lg font-bold transition active:scale-95 whitespace-nowrap">خروج</button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 lg:p-6 custom-scrollbar">
                        {adminTab === 'dashboard' && (

                                <div className="bg-white p-6 lg:p-8 rounded-[2rem] shadow-xl flex flex-col items-center justify-center gap-6 border-b-8 border-orange-100">
                                    <h3 className="text-2xl lg:text-3xl font-black text-gray-800">{gameConfig.isLocked ? "المسابقة مقفلة" : "المسابقة جارية الآن"}</h3>

                                        <button onClick={actions.resetGameStatus} className="bg-red-600 text-white px-8 lg:px-10 py-4 lg:py-5 rounded-2xl lg:rounded-3xl font-bold text-lg lg:text-xl shadow-xl hover:bg-red-700 transform hover:scale-105 transition active:scale-95">إيقاف المسابقة</button>
                                    </div>
                                    <div className="flex flex-wrap justify-center gap-4 mt-2">

                                        >
                                            <i className="fas fa-print"></i> طباعة نماذج جميع المدارس ({schools.length})
                                        </button>

                                                <div className="bg-white p-2.5 rounded-xl border border-orange-100">

                                                    <div className="text-lg font-black text-emerald-600">صفر (0)</div>
                                                </div>
                                            </div>
                                            {previewGrid && missingWords.length > 0 && (
                                                <div className="mt-3 p-3 bg-red-50 rounded-xl border border-red-200 animate-fadeIn">

                                                    <ul className="text-xs list-disc list-inside mb-2 max-h-20 overflow-y-auto custom-scrollbar">{missingWords.map((w,i)=><li key={i}>{w}</li>)}</ul>
                                                    <button onClick={handleDeleteMissingQuestions} className="w-full bg-red-600 text-white py-1.5 rounded-lg text-xs font-bold hover:bg-red-700 shadow-sm transition active:scale-95">حذف الكلمات المرفوضة من البنك</button>
                                                </div>
                                            )}

                                        <div className="flex-1 bg-gray-50 rounded-2xl border-2 border-gray-100 p-3 flex flex-col overflow-hidden">

                                                                key={i}

                                                                title={colorInfo ? `سؤال #${colorInfo.num}: ${colorInfo.question} (${colorInfo.answer})` : 'حرف عشوائي'}
                                                                style={colorInfo ? {
                                                                    backgroundColor: colorInfo.bg,
                                                                    borderColor: colorInfo.border,
                                                                    color: colorInfo.text,
                                                                    borderWidth: '2px',
                                                                    borderStyle: 'solid',
                                                                    opacity: isDimmed ? 0.25 : 1,
                                                                    fontSize: `clamp(7px, calc(34vmin / ${previewGridSize}), 18px)`,
                                                                    lineHeight: 1
                                                                } : {
                                                                    opacity: isDimmed ? 0.2 : 1,
                                                                    fontSize: `clamp(7px, calc(34vmin / ${previewGridSize}), 18px)`,
                                                                    lineHeight: 1
                                                                }}
                                                                className={`relative flex items-center justify-center font-black overflow-hidden rounded transition-all ${colorInfo ? 'cursor-pointer shadow-sm scale-[1.01]' : 'bg-white text-gray-300'}`}
                                                            >
                                                                {colorInfo && (
                                                                    <span className="absolute top-[1px] right-[2px] text-[8px] font-black opacity-80 leading-none tabular-nums">
                                                                        {colorInfo.num}
                                                                    </span>

                                                                {cell.char}
                                                            </div>
                                                        );

                                                </div>
                                            </div>
                                        ) : null}
                                    </div>
                                </div>
                            </div>
                        )}

                        {adminTab === 'questions' && (
                            <div className="bg-white p-6 lg:p-8 rounded-3xl shadow-xl h-full flex flex-col animate-fadeIn">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">

                                    <div className="flex gap-2 w-full sm:w-auto">

                                        <button onClick={actions.deleteAllQuestionsFromDB} className="flex-1 sm:flex-none bg-red-50 text-red-600 px-6 py-2 rounded-xl font-bold hover:bg-red-100 transition">مسح الكل</button>

                                            <button onClick={() => actions.deleteQuestionFromDB(q.id)} className="text-red-300 hover:text-red-600 p-2 transition opacity-100 lg:opacity-0 group-hover:opacity-100"><i className="fas fa-trash"></i></button>

                        {adminTab === 'schools' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8 animate-fadeIn h-full overflow-y-auto custom-scrollbar pb-10">
                                <div className="bg-white p-6 lg:p-8 rounded-3xl shadow-xl border-2 border-gray-50 flex flex-col h-fit">
                                    <h3 className="font-black text-xl mb-6 border-b pb-4 text-orange-800">تسجيل مدرسة</h3>
                                    <div className="space-y-4 lg:space-y-5">
                                        <input type="text" placeholder="اسم المدرسة" value={newSchoolState.newS.name} onChange={e=>newSchoolState.setNewS({...newSchoolState.newS, name: e.target.value})} className="w-full p-3 border-2 border-gray-100 rounded-xl outline-none focus:border-orange-500" />
                                        <input type="text" placeholder="كلمة المرور" value={newSchoolState.newS.pass} onChange={e=>newSchoolState.setNewS({...newSchoolState.newS, pass: e.target.value})} className="w-full p-3 border-2 border-gray-100 rounded-xl outline-none focus:border-orange-500" />
                                        <select value={newSchoolState.newS.type} onChange={e=>newSchoolState.setNewS({...newSchoolState.newS, type: e.target.value})} className="w-full p-3 border-2 border-gray-100 rounded-xl bg-white font-bold">

                                    </div>

                                <div className="lg:col-span-2 bg-white p-6 lg:p-8 rounded-3xl shadow-xl border-2 border-gray-50 flex flex-col overflow-hidden min-h-[400px] h-full">
                                    <div className="flex justify-between items-center mb-6">

                                        <button onClick={actions.deleteAllSchoolsFromDB} className="text-red-500 text-sm font-bold hover:underline">حذف جميع المدارس</button>

                                        {schools.map(s => (

                                                <button onClick={() => actions.deleteSchoolFromDB(s.id)} className="text-red-200 hover:text-red-500 p-3 transition opacity-100 lg:opacity-0 group-hover:opacity-100"><i className="fas fa-trash"></i></button>
                                            </div>

                    </div>

                    {importState.importModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-4xl p-6 lg:p-8 rounded-[2rem] shadow-2xl flex flex-col gap-4 lg:gap-6 animate-scaleIn">
                                <h3 className="text-xl lg:text-2xl font-black text-center">استيراد من Excel</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-6 flex-1 min-h-[250px] lg:min-h-[300px]">
                                    <div className="flex flex-col"><label className="font-bold text-sm mb-2 text-orange-600">قائمة الأسئلة</label><textarea value={importState.textQ} onChange={e=>importState.setTextQ(e.target.value)} className="flex-1 p-4 border rounded-2xl bg-gray-50 resize-none font-mono text-sm focus:border-orange-500 outline-none" placeholder="انسخ عمود الأسئلة هنا..."></textarea></div>
                                    <div className="flex flex-col"><label className="font-bold text-sm mb-2 text-green-600">قائمة الأجوبة</label><textarea value={importState.textA} onChange={e=>importState.setTextA(e.target.value)} className="flex-1 p-4 border rounded-2xl bg-gray-50 resize-none font-mono text-sm focus:border-green-500 outline-none" placeholder="انسخ عمود الأجوبة هنا..."></textarea></div>
                                </div>
                                <div className="flex flex-col sm:flex-row gap-3 lg:gap-4 pt-4">
                                    <button onClick={importState.handleImport} className="w-full sm:w-2/3 bg-orange-600 text-white py-3 lg:py-4 rounded-2xl font-bold text-lg hover:bg-orange-700 transition shadow-lg active:scale-95">بدء الاستيراد</button>
                                    <button onClick={() => importState.setImportModal(false)} className="w-full sm:w-1/3 bg-gray-200 text-gray-600 py-3 lg:py-4 rounded-2xl font-bold text-lg hover:bg-gray-300 transition active:scale-95">إلغاء</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- نقطة التجميع الرئيسية للتطبيق ---
        function App() {
            const [user, setUser] = useState(null);
            // تحميل فوري من الكاش المحلي لتفادي أي تأخير في ظهور الأسئلة أو الواجهة
            const [questions, setQuestions] = useState(() => loadCache(CACHE_KEYS.QUESTIONS, []));
            const [schools, setSchools] = useState(() => loadCache(CACHE_KEYS.SCHOOLS, []));
            const [gameConfig, setGameConfig] = useState(() => loadCache(CACHE_KEYS.CONFIG, { isLocked: true, startTime: null }));
            const [isDataLoaded, setIsDataLoaded] = useState(() => loadCache(CACHE_KEYS.QUESTIONS, []).length > 0);
            const [gameState, setGameState] = useState('welcome'); 

            const [currentSchoolId, setCurrentSchoolId] = useState(null);
            const [grid, setGrid] = useState([]);
            const [gridSize, setGridSize] = useState(12);
            const [solvedQuestions, setSolvedQuestions] = useState([]);
            const [solvedCells, setSolvedCells] = useState([]);
            const [selection, setSelection] = useState({ start: null, current: null, active: false });
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(null);
            const [startTimeStamp, setStartTimeStamp] = useState(null);
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [showExitConfirm, setShowExitConfirm] = useState(false);
            const [isPracticeMode, setIsPracticeMode] = useState(false);
            const [adminTab, setAdminTab] = useState('dashboard');
            
            const [importModal, setImportModal] = useState(false);
            const [textQ, setTextQ] = useState('');
            const [textA, setTextA] = useState('');
            const [newS, setNewS] = useState({ name: '', pass: '', type: 'boys' });

            // الأسئلة "الفعلية" لهذه الجولة: تشمل جميع الأسئلة التي تم تسكينها في الشبكة.
            const activeQuestions = useMemo(() => {
                if (isPracticeMode) return TRAINING_QUESTIONS;
                if (!grid || grid.length === 0) return questions;
                const placedIds = new Set();
                grid.forEach(c => {
                    if (c.wordId) placedIds.add(c.wordId);
                    if (Array.isArray(c.wordIds)) c.wordIds.forEach(id => placedIds.add(id));
                });
                const filtered = questions.filter(q => placedIds.has(q.id));
                return filtered.length > 0 ? filtered : questions;
            }, [grid, questions, isPracticeMode]);

            // بدء الاستماع لقاعدة البيانات بالتوازي مع المصادقة دون انتظار متسلسل يبطئ التحميل
            useEffect(() => {
                const unsubAuth = auth.onAuthStateChanged((u) => {
                    if (u) setUser(u);
                    else auth.signInAnonymously().catch(e => console.error(e));
                });

                const basePath = `artifacts/${appId}/public/data`;
                const unsubConfig = db.collection(basePath + '/game_config').doc('main').onSnapshot(doc => { 
                    if (doc.exists) {
                        const data = doc.data();
                        setGameConfig(data);
                        saveCache(CACHE_KEYS.CONFIG, data);
                    }
                }, err => console.warn(err));

                const unsubQ = db.collection(basePath + '/questions').onSnapshot(s => { 
                    const qList = s.docs.map(d => ({id:d.id, ...d.data()}));
                    setQuestions(qList);
                    saveCache(CACHE_KEYS.QUESTIONS, qList);
                    setIsDataLoaded(true);
                }, err => console.warn(err));

                const unsubS = db.collection(basePath + '/schools').onSnapshot(s => {
                    const sList = s.docs.map(d => ({id:d.id, ...d.data()}));
                    setSchools(sList);
                    saveCache(CACHE_KEYS.SCHOOLS, sList);
                }, err => console.warn(err));

                return () => { unsubAuth(); unsubQ(); unsubS(); unsubConfig(); };
            }, []);

            useEffect(() => {
                if (gameConfig.startTime) {
                    const timer = setInterval(() => {
                        const rem = Math.max(0, COMPETITION_DURATION_MS - (Date.now() - gameConfig.startTime));
                        setTimeLeft(rem);
                        if (rem === 0 && !isPracticeMode && gameState === 'playing') setGameState('result');
                    }, 1000);
                    return () => clearInterval(timer);
                } else setTimeLeft(null);
            }, [gameConfig.startTime, gameState, isPracticeMode]);

            useEffect(() => {
                if (gameState === 'spectator' && (gameConfig.isLocked || !gameConfig.startTime)) setGameState('welcome');
            }, [gameState, gameConfig.isLocked, gameConfig.startTime]);

            const startGame = () => db.collection(`artifacts/${appId}/public/data/game_config`).doc('main').update({ isLocked: false, startTime: Date.now() });
            const resetGameStatus = () => db.collection(`artifacts/${appId}/public/data/game_config`).doc('main').update({ isLocked: true, startTime: null });
            const deleteQuestionFromDB = (id) => getCollection('questions').doc(id).delete();
            const deleteAllQuestionsFromDB = async () => { if(confirm("حذف كل الأسئلة؟")){ const b=db.batch(); questions.forEach(q=>b.delete(getCollection('questions').doc(q.id))); await b.commit(); } };
            const addSchoolToDB = (n, p, t) => {
                // توليد شبكة خاصة ومستقلة فوراً لكل مدرسة جديدة يتم تسجيلها
                const activeQs = questions.length > 0 ? questions : TRAINING_QUESTIONS;
                const initialSize = calculateGridSize(activeQs);
                const res = generateBestGrid(activeQs, initialSize);
                const finalSize = res.size || initialSize;
                const serializedGrid = res.grid.map(c => ({
                    char: c.char,
                    wordId: c.wordId || null,
                    wordIds: c.wordId ? [c.wordId] : null
                }));
                return getCollection('schools').add({
                    name: n,
                    password: p,
                    type: t,
                    score: 0,
                    solvedCount: 0,
                    completed: false,
                    finishTime: null,
                    finishTimeMs: null,
                    lastSolveMs: null,
                    lastSolveTime: null,
                    grid: serializedGrid,
                    gridSize: finalSize,
                    solvedQuestions: [],
                    playStartTime: null
                });
            };
            const deleteSchoolFromDB = (id) => getCollection('schools').doc(id).delete();
            const deleteAllSchoolsFromDB = async () => { if(confirm("حذف جميع المدارس المسجلة؟")){ const b=db.batch(); schools.forEach(s=>b.delete(getCollection('schools').doc(s.id))); await b.commit(); } };
            // تصفير النتائج مع توليد شبكة جديدة ومستقلة لكل مدرسة
            const resetAllSchools = async () => {
                if(confirm("تصفير جميع نتائج المدارس وتوليد شبكة جديدة خاصة لكل مدرسة؟")){
                    const b=db.batch();
                    const activeQs = questions.length > 0 ? questions : TRAINING_QUESTIONS;
                    const initialSize = calculateGridSize(activeQs);
                    schools.forEach(s=>{
                        const res = generateBestGrid(activeQs, initialSize);
                        const finalSize = res.size || initialSize;
                        const serializedGrid = res.grid.map(c => ({
                            char: c.char,
                            wordId: c.wordId || null,
                            wordIds: c.wordId ? [c.wordId] : null
                        }));
                        b.update(getCollection('schools').doc(s.id), {
                            score:0,
                            solvedCount:0,
                            completed:false,
                            finishTime:null,
                            finishTimeMs:null,
                            lastSolveMs:null,
                            lastSolveTime:null,
                            grid:serializedGrid,
                            gridSize:finalSize,
                            solvedQuestions:[],
                            playStartTime:null
                        });
                    });
                    await b.commit();
                }
            };
            const createNewCompetition = async () => { if(confirm("تصفير شامل؟ سيتم مسح الأسئلة والمدارس!")){ const b=db.batch(); questions.forEach(q=>b.delete(getCollection('questions').doc(q.id))); schools.forEach(s=>b.delete(getCollection('schools').doc(s.id))); b.update(db.collection(`artifacts/${appId}/public/data/game_config`).doc('main'), { isLocked: true, startTime: null }); await b.commit(); } };

            const handleStartPlaying = (sId, practice = false) => {
                setCurrentSchoolId(sId);
                setIsPracticeMode(practice);
                setSelection({start:null, current:null, active:false});

                // وضع التدريب: يبدأ من الصفر دائماً، لا يُحفظ في قاعدة البيانات
                if (practice) {
                    setGameState('playing');
                    setStartTimeStamp(Date.now());
                    const initialSize = calculateGridSize(TRAINING_QUESTIONS);
                    const res = generateBestGrid(TRAINING_QUESTIONS, initialSize);
                    setGridSize(res.size || initialSize);
                    setGrid(res.grid);
                    setSolvedQuestions([]); setSolvedCells([]); setScore(0);
                    return;
                }

                const schoolDoc = schools.find(s => s.id === sId);

                // المدرسة أنهت المسابقة مسبقاً: نعرض لها شاشة النتيجة النهائية مباشرة بدل إعادة اللعب من جديد
                if (schoolDoc && schoolDoc.completed) {
                    setScore(schoolDoc.score || 0);
                    setGameState('result');
                    return;
                }

                // التحقق من الشبكة الخاصة المحفوظة للمدرسة
                if (schoolDoc && schoolDoc.grid && schoolDoc.gridSize) {
                    const savedPlacedIds = new Set();
                    schoolDoc.grid.forEach(c => {
                        if (c.wordId) savedPlacedIds.add(c.wordId);
                        if (Array.isArray(c.wordIds)) c.wordIds.forEach(id => savedPlacedIds.add(id));
                    });
                    const allCurrentQuestionsPresent = questions.length > 0 && questions.every(q => savedPlacedIds.has(q.id));

                    if (allCurrentQuestionsPresent || (schoolDoc.solvedQuestions && schoolDoc.solvedQuestions.length > 0)) {
                        const savedSolved = schoolDoc.solvedQuestions || [];
                        const restoredGrid = schoolDoc.grid.map((c, idx) => {
                            const wIds = Array.isArray(c.wordIds) ? c.wordIds : (c.wordId ? [c.wordId] : []);
                            return {
                                char: c.char,
                                id: wIds.length > 0 ? `cell-${idx}` : `rand-${idx}`,
                                wordId: wIds[0] || undefined,
                                wordIds: wIds,
                                isRandom: wIds.length === 0
                            };
                        });
                        const restoredCells = restoredGrid.reduce((acc, c, idx) => {
                            if (c.wordIds && c.wordIds.some(id => savedSolved.includes(id))) acc.push(idx);
                            return acc;
                        }, []);
                        setGridSize(schoolDoc.gridSize);
                        setGrid(restoredGrid);
                        setSolvedQuestions(savedSolved);
                        setSolvedCells(restoredCells);
                        setScore(schoolDoc.score || 0);
                        setStartTimeStamp(schoolDoc.playStartTime || Date.now());
                        setGameState('playing');
                        return;
                    }
                }

                // توليد شبكة خاصة ومستقلة للمدرسة بدون تقاطع للكلمات وحفظها فوراً
                const now = Date.now();
                setGameState('playing');
                setStartTimeStamp(now);
                const initialSize = calculateGridSize(questions);
                const res = generateBestGrid(questions, initialSize);
                const finalSize = res.size || initialSize;
                setGridSize(finalSize);
                setGrid(res.grid);
                setSolvedQuestions([]); setSolvedCells([]); setScore(0);

                const gridToSave = res.grid.map(c => ({
                    char: c.char,
                    wordId: c.wordId || null,
                    wordIds: Array.isArray(c.wordIds) && c.wordIds.length > 0 ? c.wordIds : (c.wordId ? [c.wordId] : null)
                }));
                getCollection('schools').doc(sId).update({
                    grid: gridToSave,
                    gridSize: finalSize,
                    playStartTime: now,
                    solvedQuestions: []
                });
            };

            const getLineIndices = (start, end) => {
                const sx=start%gridSize, sy=Math.floor(start/gridSize), ex=end%gridSize, ey=Math.floor(end/gridSize), dx=ex-sx, dy=ey-sy, steps=Math.max(Math.abs(dx),Math.abs(dy));
                if(steps===0) return [start];
                if(sx!==ex && sy!==ey && Math.abs(dx)!==Math.abs(dy)) return [];
                const arr=[]; for(let i=0; i<=steps; i++) arr.push(Math.round(sy+dy/steps*i)*gridSize+Math.round(sx+dx/steps*i));
                return arr;
            };

            const handleMouseUp = () => {
                if(!selection.active) return;
                const indices = getLineIndices(selection.start, selection.current);
                const word = indices.map(i=>grid[i].char).join('');
                const rev = word.split('').reverse().join('');
                const activeQs = activeQuestions;
                const q = activeQs.find(q=>{ const a=cleanWord(q.answer); return (a===word||a===rev) && !solvedQuestions.includes(q.id) });
                if(q){
                    const newSolved = [...solvedQuestions, q.id];
                    const newScore = score + 10;
                    setSolvedQuestions(newSolved);
                    setSolvedCells(p=>[...p, ...indices]);
                    setScore(newScore);
                    
                    if(!isPracticeMode && currentSchoolId) {
                        const isCompleted = newSolved.length === activeQs.length;
                        const updates = { score: newScore, solvedCount: newSolved.length, completed: isCompleted, solvedQuestions: newSolved };
                        const startRef = startTimeStamp || gameConfig.startTime || Date.now();
                        const durationMs = Math.max(0, Date.now() - startRef);
                        updates.lastSolveMs = durationMs;
                        updates.lastSolveTime = formatTime(durationMs);
                        if (isCompleted) {
                            updates.finishTimeMs = durationMs;
                            updates.finishTime = formatTime(durationMs);
                        }
                        getCollection('schools').doc(currentSchoolId).update(updates);
                    }
                    if(newSolved.length === activeQs.length) setTimeout(()=>setGameState('result'), 1500);
                }
                setSelection({start:null, current:null, active:false});
            };

            const isSelected = (idx) => selection.active && getLineIndices(selection.start, selection.current).includes(idx);

            if (gameState === 'loading') return <LoadingScreen />;

            return (
                <div dir="rtl" className="h-[100dvh] flex flex-col overflow-hidden bg-orange-50 no-select relative w-full">
                    {gameState === 'welcome' && (
                        <WelcomeScreen setGameState={setGameState} setShowPasswordModal={setShowPasswordModal} gameConfig={gameConfig} />
                    )}

                    {gameState === 'spectator' && (
                        <SpectatorScreen schools={schools} questions={questions} gameConfig={gameConfig} timeLeft={timeLeft} setGameState={setGameState} />
                    )}

                    {gameState === 'select_school' && (
                        <SelectSchoolScreen schools={schools} questions={questions} isDataLoaded={isDataLoaded} gameConfig={gameConfig} handleStartPlaying={handleStartPlaying} setGameState={setGameState} />
                    )}

                    {(gameState === 'admin' || gameState === 'leaderboard') && (
                        <AdminScreen 
                            questions={questions} schools={schools} gameConfig={gameConfig} timeLeft={timeLeft} adminTab={adminTab} setAdminTab={setAdminTab} setGameState={setGameState} 
                            actions={{startGame, resetGameStatus, deleteQuestionFromDB, deleteAllQuestionsFromDB, addSchoolToDB, deleteSchoolFromDB, deleteAllSchoolsFromDB, resetAllSchools, createNewCompetition}}
                            importState={{importModal, setImportModal, textQ, setTextQ, textA, setTextA, handleImport: async () => {
                                const qs = textQ.trim().split('\n').filter(Boolean); const as = textA.trim().split('\n').filter(Boolean);
                                if(qs.length !== as.length) return alert("العدد غير متطابق!");
                                const batch = db.batch();
                                qs.forEach((q, i) => batch.set(getCollection('questions').doc(), { question: q.trim(), answer: as[i].trim(), createdAt: Date.now() }));
                                schools.forEach(s => {
                                    if (!s.completed && (!s.solvedQuestions || s.solvedQuestions.length === 0)) {
                                        batch.update(getCollection('schools').doc(s.id), { grid: null, gridSize: null });
                                    }
                                });
                                await batch.commit(); setImportModal(false); setTextQ(''); setTextA('');
                            }}}
                            newSchoolState={{newS, setNewS}}
                        />
                    )}

                    {gameState === 'result' && (
                        <ResultScreen schools={schools} currentSchoolId={currentSchoolId} score={score} setGameState={setGameState} isPracticeMode={isPracticeMode} />
                    )}

                    {gameState === 'playing' && (
                        <div className="h-full w-full flex flex-col" onMouseUp={handleMouseUp} onTouchEnd={handleMouseUp}>
                            <header className={`p-4 text-white flex justify-between items-center shadow-xl h-[70px] z-20 shrink-0 ${isPracticeMode ? 'bg-indigo-600 border-b-4 border-indigo-800':'bg-orange-600 border-b-4 border-orange-800'}`}>
                                <div className="flex items-center gap-2 lg:gap-4">
                                    <button onClick={(e)=>{ e.stopPropagation(); setShowExitConfirm(true); }} className="w-10 h-10 bg-black/20 rounded-xl flex items-center justify-center active:scale-90 transition shadow-inner shrink-0"><i className="fas fa-home text-lg"></i></button>
                                    <div className="flex flex-col">
                                        <span className="font-black text-lg lg:text-xl truncate max-w-[150px] lg:max-w-[250px]">{isPracticeMode ? "وضع التدريب": schools.find(s=>s.id===currentSchoolId)?.name}</span>
                                    </div>
                                </div>
                                <div className="flex gap-2 lg:gap-6 items-center shrink-0">
                                    {!isPracticeMode && <div className="bg-black/20 px-3 lg:px-5 py-1 lg:py-1.5 rounded-xl lg:rounded-2xl tabular-nums font-black text-lg lg:text-2xl shadow-inner border border-white/10 hidden sm:block">{formatTime(timeLeft)}</div>}
                                    <div className="bg-white text-orange-800 px-4 lg:px-6 py-1 lg:py-1.5 rounded-xl lg:rounded-2xl font-black text-lg lg:text-xl shadow-lg tabular-nums">{score} <span className="text-xs text-gray-400 font-bold hidden sm:inline-block">نقطة</span></div>
                                </div>
                            </header>
                            
                            <main className="game-main-layout flex-col lg:flex-row">
                                <div className="w-full lg:w-1/3 h-[30%] lg:h-full bg-white border-b-4 lg:border-b-0 lg:border-l-4 border-orange-100 p-4 lg:p-6 overflow-y-auto custom-scrollbar shadow-xl z-10 flex flex-col shrink-0">
                                    <h3 className="font-black text-orange-800 mb-3 lg:mb-6 border-b-2 pb-2 lg:pb-3 flex items-center justify-between gap-2 lg:gap-3 text-lg lg:text-2xl shrink-0">
                                        <span className="flex items-center gap-2"><i className="fas fa-tasks text-orange-400"></i> قائمة الأسئلة</span>
                                        <span className="text-xs lg:text-sm bg-orange-100 text-orange-700 px-3 py-1 rounded-full tabular-nums">{solvedQuestions.length} / {activeQuestions.length}</span>
                                    </h3>
                                    <div className="space-y-2 lg:space-y-4 pb-2 lg:pb-20 overflow-y-auto custom-scrollbar pr-2">
                                        {activeQuestions.map((q, i) => (
                                            <div key={q.id} className={`p-3 lg:p-4 rounded-xl lg:rounded-2xl border-2 transition-all duration-300 ${solvedQuestions.includes(q.id)?'bg-green-50 border-green-200 opacity-60 shadow-none':'bg-white border-orange-50 shadow-sm'}`}>
                                                <p className={`text-sm lg:text-lg font-bold leading-tight lg:leading-relaxed ${solvedQuestions.includes(q.id)?'line-through text-green-700 font-normal':'text-gray-700'}`}>
                                                    <span className="text-orange-400 ml-1 lg:ml-2 font-black">#{i+1}</span> {q.question}
                                                </p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                
                                <div className="grid-zone w-full lg:w-2/3 h-[70%] lg:h-full pb-6 lg:pb-0">
                                    <div className="responsive-grid-container" 
                                         style={{ 
                                             gridTemplateColumns: `repeat(${gridSize}, minmax(0, 1fr))`,
                                             gridTemplateRows: `repeat(${gridSize}, minmax(0, 1fr))` 
                                         }}>
                                        {grid.map((cell, idx) => (
                                            <div key={idx} onMouseDown={()=>setSelection({start:idx, current:idx, active:true})} onMouseEnter={()=>selection.active && setSelection(p=>({...p, current:idx}))} onTouchStart={(e)=>{e.preventDefault(); setSelection({start:idx, current:idx, active:true});}}
                                                 onTouchMove={(e)=>{ e.preventDefault(); const touch = e.touches[0]; const el = document.elementFromPoint(touch.clientX, touch.clientY); if (el && el.dataset.idx) setSelection(p=>({...p, current:parseInt(el.dataset.idx)})); }}
                                                 data-idx={idx} 
                                                 className={`letter-cell shadow-sm ${isSelected(idx) ? 'bg-orange-600 text-white scale-110 z-10 ring-2 ring-white shadow-xl' : solvedCells.includes(idx) ? 'bg-green-500 text-white opacity-90 scale-95' : 'bg-white text-gray-800 hover:bg-orange-50'}`}
                                                 style={{ fontSize: `clamp(8px, calc(50vmin / ${gridSize}), 32px)` }}>
                                                {cell.char}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </main>
                        </div>
                    )}

                    {showPasswordModal && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm animate-fadeIn">
                            <div className="bg-white p-8 lg:p-10 rounded-[2rem] lg:rounded-[3rem] shadow-2xl w-full max-w-xs animate-scaleIn border-b-8 border-orange-500">
                                <h3 className="font-black text-xl lg:text-2xl mb-6 text-center text-gray-800">دخول الإدارة</h3>
                                <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} autoFocus placeholder="كلمة المرور" onKeyDown={(e)=>{if(e.key==='Enter' && passwordInput === ADMIN_PASSWORD){setGameState('admin'); setShowPasswordModal(false); setPasswordInput('');} else if(e.key==='Enter') alert('خطأ');}} className="w-full p-4 border-2 border-gray-100 rounded-xl lg:rounded-2xl text-center mb-6 focus:border-orange-400 outline-none text-xl transition-all" />
                                <div className="flex flex-col gap-2">
                                    <button onClick={() => { if(passwordInput === ADMIN_PASSWORD) { setGameState('admin'); setShowPasswordModal(false); setPasswordInput(''); } else alert('خطأ'); }} className="w-full bg-orange-600 text-white py-3 rounded-xl font-bold hover:bg-orange-700 transition shadow-md active:scale-95">دخول</button>
                                    <button onClick={() => {setShowPasswordModal(false); setPasswordInput('');}} className="w-full text-gray-400 font-bold hover:text-gray-600 transition p-2">إلغاء</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showExitConfirm && (
                        <div className="fixed inset-0 bg-black/70 z-[60] flex items-center justify-center p-4 animate-fadeIn backdrop-blur-md">
                            <div className="bg-white p-8 lg:p-10 rounded-[2rem] lg:rounded-[3rem] shadow-2xl max-w-sm w-full text-center border-t-8 border-red-500 animate-scaleIn">
                                <div className="text-red-500 text-6xl mb-6 flex justify-center"><i className="fas fa-exclamation-circle"></i></div>
                                <h3 className="text-2xl font-black text-gray-800 mb-2">تنبيه بالخروج</h3>
                                <p className="text-gray-500 mb-8 font-medium">هل أنت متأكد من العودة للرئيسية؟ سيتم حفظ تقدمك الحالي.</p>
                                <div className="flex gap-4">
                                    <button onClick={()=>{ setGameState('welcome'); setShowExitConfirm(false); }} className="flex-1 bg-red-600 text-white py-3 lg:py-4 rounded-xl lg:rounded-2xl font-bold text-lg active:scale-95 transition shadow-lg text-center">خروج</button>
                                    <button onClick={()=>setShowExitConfirm(false)} className="flex-1 bg-gray-100 text-gray-600 py-3 lg:py-4 rounded-xl lg:rounded-2xl font-bold text-lg active:scale-95 transition text-center">إلغاء</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {gameState !== 'playing' && <footer className="fixed bottom-0 w-full bg-white/60 backdrop-blur-sm p-1.5 text-center text-[10px] lg:text-xs text-gray-400 font-bold z-0 border-t border-orange-100">تصميم المسابقة: أ. عبدالله بن خلف الرواحي</footer>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
